[project]
name = "support-inbox-assistant"
version = "0.1.0"
description = "Support Inbox Assistant - Intelligent email and ticket triage system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "sentry-sdk>=2.71.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
